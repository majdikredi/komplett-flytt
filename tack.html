<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tack för din offertförfrågan | Komplett Flytt och Transport</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            ink:   { DEFAULT: '#171717', light: '#262626', dark: '#0a0a0a' },
            brand: { DEFAULT: '#cc0000', dark: '#a30000' }
          }
        }
      }
    }
  </script>
</head>

<body class="font-sans antialiased bg-ink-dark text-white">
  <div class="min-h-screen flex flex-col">

    <main class="flex-1 flex items-center justify-center px-4 py-16">
      <div class="max-w-xl text-center">
        <div class="mx-auto w-24 h-24 rounded-full bg-brand/15 border-2 border-brand grid place-items-center">
          <i class="fa-solid fa-check text-5xl text-brand" aria-hidden="true"></i>
        </div>

        <h1 class="mt-8 text-3xl sm:text-4xl font-extrabold leading-tight">Tack för din offertförfrågan!</h1>

        <p class="mt-5 text-lg text-slate-300 leading-8">
          Vi har tagit emot dina uppgifter. Vi kikar på din flytt och återkommer till dig med ett prisförslag så snart som möjligt – oftast inom 24 timmar.
        </p>

        <a href="index.html"
           class="mt-10 inline-flex items-center gap-2 rounded-lg bg-brand hover:bg-brand-dark px-8 py-3.5 font-bold text-white shadow-lg transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-ink-dark">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Tillbaka till startsidan
        </a>
      </div>
    </main>

    <footer class="py-6 text-center text-sm text-slate-500 border-t border-white/10">
      &copy; Komplett Flytt och Transport
    </footer>
  </div>
</body>
</html>
